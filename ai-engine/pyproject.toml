[project]
name = "rabt-ai-engine"
version = "0.1.0"
description = "Rabt local AI engine: Ollama agent, faster-whisper STT, Kokoro TTS and SQLite memory."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "rabt-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "av>=13",                 # audio decode/encode (bundled FFmpeg incl. libopus)
    "faster-whisper>=1.2.1",
    "ctranslate2>=4.7.0",     # CUDA 12.8 Windows build: Blackwell (sm_120) capable
    "kokoro-onnx>=0.6.1",
]

[project.scripts]
rabt-ai = "rabt_ai.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rabt_ai"]

[tool.uv.sources]
rabt-shared = { workspace = true }
