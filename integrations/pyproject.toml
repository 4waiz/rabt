[project]
name = "rabt-integrations"
version = "0.1.0"
description = "Rabt integration backend: Google OAuth, Gmail, Calendar, approvals, web UI."
requires-python = ">=3.11"
dependencies = [
    "rabt-shared",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "google-api-python-client>=2.140",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[project.scripts]
rabt-integrations = "rabt_integrations.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rabt_integrations"]

[tool.uv.sources]
rabt-shared = { workspace = true }
