[project]
name = "rabt-shared"
version = "0.1.0"
description = "Rabt shared API contract: Pydantic v2 models, tool catalog and JSON Schemas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "tzdata>=2024.1",  # zoneinfo has no system tz database on Windows
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rabt_shared"]
