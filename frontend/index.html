<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabt</title>
<style>
:root{--plum:#4a1f3d;--plum2:#6b2f58;--pink:#f6d6e3;--lav:#e6defa;--cream:#fff8f1;--ink:#2b1626;--muted:#7a6272;--ok:#2f7a4f;--bad:#a8323e;--line:#ecdbe4}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--plum);color:#fff}
header h1{font-size:20px;margin:0;letter-spacing:.5px}header .who{margin-left:auto;font-size:13px;opacity:.9}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--lav);color:var(--plum)}
.badge.mock{background:#ffe2b8;color:#7a4b00}.badge.off{background:#f3d0d4;color:var(--bad)}.badge.on{background:#d4efdf;color:var(--ok)}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(74,31,61,.05)}
.card h2{margin:0 0 10px;font-size:15px;color:var(--plum)}
#log{height:380px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px}
.msg{max-width:85%;padding:9px 13px;border-radius:16px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--plum2);color:#fff;border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--pink);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:var(--lav);font-size:13px}
.row{display:flex;gap:8px;margin-top:10px}input,select{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font:inherit}
button{padding:9px 14px;border:0;border-radius:12px;background:var(--plum);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:var(--lav);color:var(--plum)}button.danger{background:#f3d0d4;color:var(--bad)}button:disabled{opacity:.45;cursor:not-allowed}
button.rec{background:var(--bad)}
.prop{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;background:#fffafc}
.prop .tool{font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;font-size:12px;background:var(--cream);padding:8px;border-radius:10px;margin:6px 0}
.slots button{margin:3px}.small{font-size:12px;color:var(--muted)}#login{max-width:360px;margin:60px auto}
.err{color:var(--bad);font-size:13px}
</style>
</head>
<body>
<header><h1>Rabt</h1><span id="aimode" class="badge">AI…</span><span class="who" id="who"></span></header>

<section id="login" class="card" hidden>
  <h2>Who is using Rabt?</h2>
  <div class="row"><select id="acct"><option value="huda">Huda Mueen (student)</option><option value="awaiz">Awaiz Ahmed (tutor)</option></select></div>
  <div class="row"><input id="pin" type="password" placeholder="PIN" autocomplete="current-password"></div>
  <div class="row"><button onclick="login()">Sign in</button></div><p class="err" id="loginerr"></p>
</section>

<main id="app" hidden>
  <div>
    <section class="card">
      <h2>Chat</h2>
      <div id="log"></div>
      <div class="row">
        <input id="text" placeholder="Can we do tuition tomorrow evening? Check when we're both free." onkeydown="if(event.key==='Enter')send()">
        <button id="mic" class="ghost" onclick="toggleMic()" title="Speak">Mic</button>
        <button onclick="send()">Send</button>
      </div>
      <p class="small">Voice replies are AI-generated by the local engine. <label><input type="checkbox" id="autospeak" checked style="flex:none"> speak replies</label></p>
    </section>
    <section class="card" style="margin-top:16px">
      <h2>Pending approvals</h2>
      <div id="pending"><p class="small">Nothing waiting for you.</p></div>
    </section>
  </div>
  <div>
    <section class="card">
      <h2>Lesson planner</h2>
      <div id="lesson"><p class="small">No lesson request yet.</p></div>
    </section>
    <section class="card" style="margin-top:16px">
      <h2>Integrations &amp; consent</h2>
      <div id="status" class="small"></div>
      <div class="row"><button class="ghost" onclick="googleTest()">Test my Google connection</button></div>
      <label class="small"><input type="checkbox" id="share" style="flex:none" onchange="setShare()"> Share my free/busy times (never event titles) with the other participant</label>
      <pre id="gtest" hidden></pre>
    </section>
    <section class="card" style="margin-top:16px">
      <h2>Activity</h2><div id="activity" class="small"></div>
      <div class="row"><button class="ghost" onclick="logout()">Switch identity</button></div>
    </section>
  </div>
</main>

<script>
let ME=null, rec=null, chunks=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=iso=>new Date(iso).toLocaleString('en-GB',{timeZone:'Asia/Dubai',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
async function api(path,opts={}){const r=await fetch(path,{headers:{'Content-Type':'application/json'},credentials:'same-origin',...opts});
  const ct=r.headers.get('content-type')||'';const body=ct.includes('json')?await r.json():r;
  if(!r.ok){const d=body.detail||body.error||body;throw new Error(d.message||d.code||(typeof d==='string'?d:JSON.stringify(d)));}return body;}
function say(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;$('log').appendChild(d);$('log').scrollTop=1e9;}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({account_id:$('acct').value,pin:$('pin').value})});$('pin').value='';boot();}catch(e){$('loginerr').textContent=e.message;}}
async function logout(){await api('/api/logout',{method:'POST'});location.reload();}
async function boot(){
  try{ME=await api('/api/me');}catch(e){$('login').hidden=false;$('app').hidden=true;return;}
  $('login').hidden=true;$('app').hidden=false;$('who').textContent=`${ME.display_name} · ${ME.role}`;$('share').checked=ME.shares_freebusy;
  if(ME.role==='tutor')$('text').placeholder='Ask Rabt about your schedule or email…';
  refresh();
}
async function refresh(){
  const [st,props,lesson,act]=await Promise.all([api('/api/status'),api('/api/proposals'),api('/api/lesson'),api('/api/activity')]);
  const m=$('aimode');m.textContent=st.ai_mode==='mock'?'MOCK AI (no LLM)':(st.ai.reachable?'Local AI connected':'Local AI offline');
  m.className='badge '+(st.ai_mode==='mock'?'mock':st.ai.reachable?'on':'off');
  $('status').innerHTML=Object.entries(st.accounts).map(([id,a])=>`<div>${esc(id)}: Google <span class="badge ${a.google_connected?'on':'off'}">${a.google_connected?'connected':'not connected'}</span>${a.google_email?' '+esc(a.google_email):''} · free/busy ${a.shares_freebusy?'shared':'private'}</div>`).join('');
  renderPending(props.filter(p=>p.status==='pending'));renderLesson(lesson);
  $('activity').innerHTML=act.slice(0,12).map(a=>`<div>${fmt(a.at)} — ${esc(a.action)}${a.detail.tool?' · '+esc(a.detail.tool):''}${a.detail.error?' · <span class=err>'+esc(a.detail.error)+'</span>':''}</div>`).join('')||'No activity yet.';
}
function preview(p){const a=p.args;
  if(p.tool==='calendar.create_event')return `Event: ${a.title}\nWhen: ${fmt(a.start)} – ${fmt(a.end)} (${a.timezone})\nInvite: ${a.attendee_account_ids.join(', ')}\n${a.description||''}`;
  if(p.tool==='gmail.create_draft')return `Draft only (not sent)\nTo: ${[...a.to_account_ids,...a.to_emails].join(', ')}\nSubject: ${a.subject}\n\n${a.body}`;
  return JSON.stringify(a,null,2);}
function renderPending(list){
  $('pending').innerHTML=list.length?list.map(p=>`<div class="prop"><div class="tool">${esc(p.tool)}</div><b>${esc(p.summary)}</b><pre>${esc(preview(p))}</pre>
  <button onclick="decide('${p.proposal_id}','approve')">Approve</button> <button class="danger" onclick="decide('${p.proposal_id}','reject')">Reject</button></div>`).join(''):'<p class="small">Nothing waiting for you.</p>';}
function renderLesson(l){
  if(!l){$('lesson').innerHTML='<p class="small">No lesson request yet. The student asks Rabt in chat to start one.</p>';return;}
  const tutor=l.my_role==='tutor', open=['REQUESTED','PROPOSED','COUNTERED','AWAITING_APPROVAL'].includes(l.state);
  let h=`<div>State: <span class="badge">${esc(l.state)}</span> v${l.version}</div>`;
  if(l.slot_start)h+=`<p>Slot: <b>${fmt(l.slot_start)} – ${fmt(l.slot_end)}</b><br><span class="small">Tutor ${l.tutor_agreed?'agreed':'pending'} · Student ${l.student_agreed?'agreed':'pending'}</span></p>`;
  if(open&&l.options.length){h+=`<div class="small">Mutually free options (${tutor?'propose':'counter with'} one):</div><div class="slots">`+
    l.options.map(o=>`<button class="ghost" onclick="lessonAct('${tutor?'propose':'counter'}','${o.start}')">${fmt(o.start)}</button>`).join('')+'</div>';}
  const mine=tutor?l.tutor_agreed:l.student_agreed;
  if(open&&l.slot_start&&!mine)h+=`<div class="row"><button onclick="lessonAct('accept')">Accept this time</button></div>`;
  if(l.state==='AWAITING_APPROVAL'&&!tutor)h+=`<div class="row"><button onclick="bookIt()">Ask Rabt to book it</button></div><p class="small">You'll see the event and email previews before anything is created.</p>`;
  if(l.state==='EXECUTED'&&l.event_link)h+=`<p><a href="${esc(l.event_link)}" target="_blank" rel="noopener">Open the verified Google Calendar event</a></p>`;
  if(l.note)h+=`<p class="small">${esc(l.note)}</p>`;
  if(open)h+=`<div class="row"><button class="danger" onclick="lessonAct('cancel')">Cancel request</button></div>`;
  $('lesson').innerHTML=h;}
async function lessonAct(action,start){try{await api(`/api/lesson/${(await api('/api/lesson')).lesson_id}`,{method:'POST',body:JSON.stringify({action,start})});}catch(e){say(e.message,'sys');}refresh();}
async function bookIt(){const l=await api('/api/lesson');const other=ME.role==='student'?'Awaiz':'Huda';
  $('text').value=`Yes, please book tuition with ${other} from ${l.slot_start} to ${l.slot_end} and draft a confirmation email to ${other}.`;send();}
async function handle(res){if(!res.replies.length&&res.pending.length)say('Recorded. Rabt will report back once you decide on the remaining item.','sys');for(const t of res.replies)say(t,'ai');if(res.replies.length&&$('autospeak').checked)speak(res.replies.at(-1));refresh();}
async function send(){const t=$('text').value.trim();if(!t)return;$('text').value='';say(t,'me');
  try{await handle(await api('/api/chat',{method:'POST',body:JSON.stringify({message:t})}));}catch(e){say('Error: '+e.message,'sys');}}
async function decide(id,what){try{await handle(await api(`/api/proposals/${id}/${what}`,{method:'POST'}));}catch(e){say(`${what} failed: ${e.message}`,'sys');refresh();}}
async function speak(text){try{const r=await fetch('/api/voice/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  if(!r.ok)return;const url=URL.createObjectURL(await r.blob());new Audio(url).play();}catch(e){}}
async function toggleMic(){
  if(rec){rec.stop();return;}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];rec=new MediaRecorder(s);
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());$('mic').classList.remove('rec');$('mic').textContent='Mic';rec=null;
      const fd=new FormData();fd.append('file',new Blob(chunks,{type:'audio/webm'}),'speech.webm');
      const r=await fetch('/api/voice/transcribe',{method:'POST',body:fd});const j=await r.json();
      if(!r.ok){say('Speech input unavailable: '+((j.detail&&j.detail.message)||'error')+' — type instead.','sys');return;}
      $('text').value=j.text;send();};
    rec.start();$('mic').classList.add('rec');$('mic').textContent='Stop';}catch(e){say('Microphone not available — type instead.','sys');}}
async function setShare(){await api('/api/settings/share-freebusy',{method:'POST',body:JSON.stringify({enabled:$('share').checked})});refresh();}
async function googleTest(){$('gtest').hidden=false;$('gtest').textContent='Testing…';try{$('gtest').textContent=JSON.stringify(await api('/api/google/test',{method:'POST'}),null,2);}catch(e){$('gtest').textContent='Failed: '+e.message;}refresh();}
setInterval(()=>{if(ME)refresh();},5000);boot();
</script>
</body>
</html>
