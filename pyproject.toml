[project]
name = "rabt-workspace"
version = "0.1.0"
description = "Rabt monorepo workspace root (not a distributable package)."
requires-python = ">=3.11"
dependencies = ["rabt-shared", "rabt-ai-engine", "rabt-integrations"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
# NVIDIA cuBLAS 12.8+ for GPU speech recognition (CTranslate2). Opt in: `uv sync --group cuda`.
cuda = ["nvidia-cublas-cu12>=12.8.4; sys_platform == 'win32' or sys_platform == 'linux'"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["shared", "ai-engine", "integrations"]

[tool.uv.sources]
rabt-shared = { workspace = true }
rabt-ai-engine = { workspace = true }
rabt-integrations = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fast offline suite by default; `pytest -m live` / `pytest -m speech` run against real local models.
addopts = "-ra -m 'not live and not speech'"
markers = [
    "live: needs the local Ollama model (and GPU when available); run with -m live",
    "speech: needs downloaded Whisper/Kokoro models; run with -m speech",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # `ruff format` owns line length; long string literals are fine

[tool.ruff.lint.isort]
known-first-party = ["rabt_shared", "rabt_ai", "rabt_integrations"]
